# =====================================================================================================================
#  Portão seccionado DEA Spazio 703S (central 124RRZ) no Home Assistant, com os botões C e D do comando Extel
#
#  ESP32 + 3 relés ligados à central DEA. O Home Assistant vê um portão de garagem (cover) com estado
#  aberto / fechado / a abrir / a fechar. A lógica corre no ESP32.
#
#  Bornes da central 124RRZ (manual Spazio, Tabela 1):
#    16 START   N.A.  -> relé ABRIR   (com P030 = 1, "AP"/START inicia a abertura)
#    17 PEDON   N.A.  -> relé FECHAR  (com P030 = 1, PED inicia o fecho)
#    18 STOP    N.F.  -> contacto NF do relé PARAR, em série (no lugar da ponte 18-21)
#    21 COM           -> comum das entradas
#    5-6 contacto livre (P027 = 0): fechado com o portão em movimento ou aberto; abre só quando o fecho
#                      termina -> sensor "fechado" ligado ao ESP32 (não é preciso sensor magnético)
#
#  Parâmetros a programar na central: P030 = 001 (PED fecha, AP abre); P027 = 000.
#
#  Botões C e D do comando Extel WEATEM 5 (rolling code, 433,92 MHz), montagem B do README:
#    recebidos por um recetor Extel TRANSMY (ATRC 3), que verifica o rolling code completo. As saídas
#    NO/COM do TRANSMY ligam ou diretamente a 16-21 e 17-21 da central (o ESP32 só lê o estado por 5-6),
#    ou às entradas canal_c e canal_d deste ESP32, que então atua os relés.
#  Na montagem A (comando DEA GTI4 + recetor 291/X na placa Extel) as entradas canal_c / canal_d não se usam.
# =====================================================================================================================

substitutions:
  nome: portao-seccionado
  nome_amigavel: Portão seccionado
  # Tempo do curso completo, medido no local (um pouco acima do real).
  tempo_curso: 20s
  # Se o fecho não for confirmado (contacto 5-6) até aqui, o portão fica "aberto"
  # (a fotocélula ou a deteção de obstáculo podem ter invertido o movimento).
  tempo_maximo: 35s
  # Duração do impulso nos bornes da central.
  impulso: 600ms
  # Repetições do mesmo botão dentro desta janela contam como um só toque.
  janela_repeticao: 1500ms
  # GPIO (ESP32 DevKit). Ajustar à placa de relés usada.
  pino_rele_abrir: GPIO26
  pino_rele_fechar: GPIO27
  pino_rele_parar: GPIO25
  pino_contacto_fechado: GPIO32
  pino_canal_c: GPIO33
  pino_canal_d: GPIO14

esphome:
  name: ${nome}
  friendly_name: ${nome_amigavel}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret ota_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${nome} fallback"
    password: !secret fallback_password

captive_portal:

# ---------------------------------------------------------------------------------------------------------------------
# Relés: cada um dá um impulso e desliga-se sozinho
# ---------------------------------------------------------------------------------------------------------------------
switch:
  # Contacto NA entre 16 (START) e 21 (COM).
  - platform: gpio
    id: rele_abrir
    name: "Relé abrir (START)"
    pin: ${pino_rele_abrir}
    restore_mode: ALWAYS_OFF
    internal: true
    on_turn_on:
      - delay: ${impulso}
      - switch.turn_off: rele_abrir

  # Contacto NA entre 17 (PEDON) e 21 (COM).
  - platform: gpio
    id: rele_fechar
    name: "Relé fechar (PEDON)"
    pin: ${pino_rele_fechar}
    restore_mode: ALWAYS_OFF
    internal: true
    on_turn_on:
      - delay: ${impulso}
      - switch.turn_off: rele_fechar

  # Contacto NF (COM-NC do relé) em série no circuito 18 (STOP) - 21 (COM).
  # Relé desligado = circuito fechado = funcionamento normal. Um impulso abre o circuito e a central para.
  # Se o ESP32 ficar sem alimentação, o contacto NF mantém-se fechado e o portão funciona normalmente.
  - platform: gpio
    id: rele_parar
    name: "Relé parar (STOP)"
    pin: ${pino_rele_parar}
    restore_mode: ALWAYS_OFF
    internal: true
    on_turn_on:
      - delay: ${impulso}
      - switch.turn_off: rele_parar

# ---------------------------------------------------------------------------------------------------------------------
# Scripts dos botões do comando
# ---------------------------------------------------------------------------------------------------------------------
script:
  # Botão C: abrir; se já estiver a abrir, parar.
  - id: botao_abrir
    then:
      - if:
          condition:
            lambda: return id(portao).current_operation == cover::COVER_OPERATION_OPENING;
          then:
            - cover.stop: portao
          else:
            - cover.open: portao

  # Botão D: fechar; se já estiver a fechar, parar.
  - id: botao_fechar
    then:
      - if:
          condition:
            lambda: return id(portao).current_operation == cover::COVER_OPERATION_CLOSING;
          then:
            - cover.stop: portao
          else:
            - cover.close: portao

# ---------------------------------------------------------------------------------------------------------------------
# Sensores e entradas
# ---------------------------------------------------------------------------------------------------------------------
binary_sensor:
  # Contacto livre 5-6 da central (P027 = 0), ligado entre o GPIO e GND.
  # Contacto fechado (portão aberto ou em movimento) -> GPIO a 0. Contacto aberto (fecho concluído) -> GPIO a 1.
  # Por isso "on" (GPIO a 1, com pull-up) = portão fechado.
  - platform: gpio
    id: fim_fechado
    name: "Portão fechado (central)"
    pin:
      number: ${pino_contacto_fechado}
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 200ms
    on_release:
      # Abriu sem passar pelo ESP32 (comando DEA, botoneira, recetor da central): mostrar como aberto.
      - lambda: |-
          if (id(portao).current_operation == cover::COVER_OPERATION_IDLE &&
              id(portao).position == cover::COVER_CLOSED) {
            id(portao).position = cover::COVER_OPEN;
            id(portao).publish_state();
          }

  # Saída do canal 1 do recetor TRANSMY (contacto seco entre o GPIO e GND), botão C. Dispensável se o
  # TRANSMY ligar diretamente à central ou na montagem A.
  - platform: gpio
    id: canal_c
    name: "Comando Extel botão C"
    pin:
      number: ${pino_canal_c}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: ${janela_repeticao}
    on_press:
      - script.execute: botao_abrir

  # Saída do canal 2 do recetor TRANSMY, botão D.
  - platform: gpio
    id: canal_d
    name: "Comando Extel botão D"
    pin:
      number: ${pino_canal_d}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: ${janela_repeticao}
    on_press:
      - script.execute: botao_fechar

# ---------------------------------------------------------------------------------------------------------------------
# O portão visto pelo Home Assistant
# ---------------------------------------------------------------------------------------------------------------------
cover:
  - platform: feedback
    id: portao
    name: None
    device_class: garage
    # A central DEA para sozinha nos fins de curso: o ESP32 não envia STOP no fim do tempo de curso.
    has_built_in_endstop: true
    open_duration: ${tempo_curso}
    close_duration: ${tempo_curso}
    max_duration: ${tempo_maximo}
    close_endstop: fim_fechado
    open_action:
      - switch.turn_on: rele_abrir
    close_action:
      - switch.turn_on: rele_fechar
    stop_action:
      # Seguro mesmo com o portão parado: a entrada STOP só bloqueia, nunca põe o portão em movimento.
      - switch.turn_on: rele_parar
